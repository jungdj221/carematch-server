spring:
  application:
    name: carematch-server
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: http://localhost:3000

---
spring:
  config:
    activate:
      on-profile: prod
